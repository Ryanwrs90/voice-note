<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="想法">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>想法</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>想法</h1>
  <button class="icon-btn" id="btn-settings" aria-label="设置"></button>
</header>

<div class="search" id="search" hidden>
  <input id="search-input" type="search" placeholder="搜索文字和转写" autocomplete="off">
  <button class="text-btn" id="search-close">取消</button>
</div>

<main>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>按下面的红色按钮，把想法说出来</p>
  <button class="done-toggle" id="done-toggle" hidden></button>
  <ul class="list done-list" id="done-list" hidden></ul>
  <p class="version" id="version"></p>
</main>

<button class="update-pill" id="update" hidden></button>

<nav class="bar" id="bar">
  <button class="icon-btn" id="btn-add" aria-label="新建文字"></button>
  <button class="rec-btn" id="btn-rec" aria-label="开始录音"><span class="rec-inner"></span></button>
  <button class="icon-btn" id="btn-search" aria-label="搜索"></button>
</nav>

<div class="rec-panel" id="rec-panel" hidden>
  <button class="icon-btn" id="btn-cancel" aria-label="取消录音"></button>
  <button class="rec-btn recording" id="btn-stop" aria-label="停止并保存"><span class="rec-inner"></span></button>
  <div class="rec-time"><span class="dot"></span><span id="rec-time">0:00</span></div>
</div>

<div class="overlay" id="sheet-overlay" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<div class="toast" id="toast" hidden></div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
